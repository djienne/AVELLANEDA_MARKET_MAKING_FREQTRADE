name: avellaneda-mm
x-app: &app
  image: ft-avellaneda_market_making_freqtrade:2025.10
  init: true
  restart: unless-stopped
  stop_grace_period: 60s
  deploy:
    resources:
      limits:
        memory: 512M
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  freqtrade_mm:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.technical
    env_file: .env
    environment:
      AVELLANEDA_PARAMS_DIR: /freqtrade/params
      AVELLANEDA_STATE: /freqtrade/state/trial.json
      NUMBA_CACHE_DIR: /freqtrade/state/numba_cache
    ports: ["127.0.0.1:3004:8080"]
    volumes:
      - ./user_data:/freqtrade/user_data:ro
      - ./scripts:/freqtrade/scripts:ro
      - ./runtime/main/state:/freqtrade/state
      - ./runtime/main/params:/freqtrade/params:ro
    command: >
      trade --logfile /freqtrade/state/freqtrade.log
      --db-url sqlite:////freqtrade/state/trades.sqlite
      --userdir /freqtrade/state --strategy-path /freqtrade/user_data/strategies
      --config /freqtrade/user_data/config.json --strategy avellaneda

  hl-params:
    <<: *app
    volumes:
      - ./HL_data_collector:/freqtrade/HL_data_collector:ro
      - ./user_data:/freqtrade/user_data:ro
      - ./scripts:/freqtrade/scripts:ro
      - ./runtime/main/market-data:/freqtrade/market-data:ro
      - ./runtime/main/params:/freqtrade/params
    environment:
      HL_DATA_LOC: /freqtrade/market-data
      AVELLANEDA_PARAMS_DIR: /freqtrade/params
      NUMBA_CACHE_DIR: /freqtrade/params/numba_cache
    entrypoint: ["python", "/freqtrade/scripts/calculate_avellaneda_parameters.py", "--loop"]

  hl-collector:
    <<: *app
    volumes:
      - ./HL_data_collector:/freqtrade/HL_data_collector:ro
      - ./scripts:/freqtrade/scripts:ro
      - ./runtime/main/market-data:/freqtrade/market-data
    environment:
      SYMBOLS: "PAXG,ETH"
      OUTPUT_DIR: /freqtrade/market-data
      ORDERBOOK_DEPTH: "5"
    entrypoint: ["python", "/freqtrade/HL_data_collector/run_collector.py"]
